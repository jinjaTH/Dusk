name: Publish to Modrinth

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Get jar path
        id: jar
        run: |
          ls -la build/libs/
          JAR=$(ls build/libs/dusk-*-remapped.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then
            JAR=$(ls build/libs/dusk-*.jar | grep -v sources | head -1)
          fi
          echo "path=$JAR" >> $GITHUB_OUTPUT
          echo "name=$(basename $JAR)" >> $GITHUB_OUTPUT
          echo "Selected: $JAR"

      - name: Read gradle.properties
        id: props
        run: |
          MC=$(grep minecraft_version gradle.properties | cut -d= -f2)
          MOD=$(grep mod_version gradle.properties | cut -d= -f2)
          echo "mc=$MC" >> $GITHUB_OUTPUT
          echo "mod=$MOD" >> $GITHUB_OUTPUT

      - name: Update project metadata
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          # Upload icon
          curl -s -X PATCH \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "Content-Type: image/png" \
            --data-binary @icon.png \
            "https://api.modrinth.com/v2/project/dusk-nyctophobia/icon?ext=png" || true

          # Update description, body, license
          BODY=$(python3 -c "
          import json
          print(json.dumps({
            'title': 'Dusk',
            'description': 'A Fabric mod that makes darkness feel like it should.',
            'body': 'Something is different about the world.\n\nYou cannot quite say what it is. The night feels longer. The silence is heavier than usual. You light a torch, and somehow it does not help.\n\nDusk is a Fabric mod that introduces real psychological phenomena into Minecraft gameplay. No jump scares. No monsters added. Nothing will tell you what is happening — you will have to figure it out yourself.\n\nWhen it ends, everything returns to normal. Like nothing happened.\n\n---\n\n## Requirements\n\n| Version | Minecraft | Fabric Loader | Fabric API | Java |\n|---|---|---|---|---|\n| 1.21.1 | 1.21.1 | ≥ 0.15.0 | 0.116.x | 21 |\n| 1.21.10 | 1.21.10 | ≥ 0.17.2 | 0.138.x | 21 |\n| 1.21.11 | 1.21.11 | ≥ 0.18.1 | 0.141.x | 21 |\n\n**Fabric API is required.**\n\n---\n\n## Credits\n\nCreated by **Dusk**',
            'license_id': 'MIT',
            'categories': ['adventure'],
            'client_side': 'required',
            'server_side': 'required',
            'link_urls': {'source': 'https://github.com/jinjaTH/Dusk'}
          }))
          ")
          curl -s -X PATCH \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "https://api.modrinth.com/v2/project/dusk-nyctophobia"

      - name: Publish version
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MC_VERSION: ${{ steps.props.outputs.mc }}
          MOD_VERSION: ${{ steps.props.outputs.mod }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
          JAR_NAME: ${{ steps.jar.outputs.name }}
          REF: ${{ github.ref_name }}
        run: |
          PROJECT_ID=$(curl -s \
            -H "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/dusk-nyctophobia" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Project ID: $PROJECT_ID"

          export PROJECT_ID
          META=$(python3 -c "
          import json, os
          mc = os.environ['MC_VERSION']
          mod = os.environ['MOD_VERSION']
          ref = os.environ['REF']
          print(json.dumps({
            'name': f'Dusk {mod} for {mc}',
            'version_number': f'{mod}+{mc}',
            'changelog': f'Release {ref}',
            'dependencies': [
              {'dependency_type': 'required', 'project_id': 'P7dR8mSH'}
            ],
            'game_versions': [mc],
            'version_type': 'release',
            'loaders': ['fabric'],
            'featured': True,
            'project_id': os.environ['PROJECT_ID'],
            'file_parts': ['jar']
          }))
          ")

          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: $MODRINTH_TOKEN" \
            -F "data=$META" \
            -F "jar=@$JAR_PATH;filename=$JAR_NAME" \
            "https://api.modrinth.com/v2/version")
          HTTP=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP $HTTP: $BODY"
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            exit 1
          fi
          echo "Version published."
